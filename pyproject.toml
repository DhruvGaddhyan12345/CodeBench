[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codebench"
version = "0.1.0"
description = "A local evaluation harness for autonomous coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codebench = "codebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
